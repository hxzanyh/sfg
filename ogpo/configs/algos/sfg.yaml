# =============================================================================
# SFG: Simple Flow Gradient — settings shared by every task (paper Table 4).
# Per-task values (env, chunk length, discount, network size, actor learning
# rate, pretrained checkpoint, eval interval) are set by scripts/sfg/<task>.sh.
# SFG runs inside the OGPO agent: `agent.sfg: true` replaces OGPO's online
# actor update by the direct Q-gradient and adds the per-episode projection.
# =============================================================================
_base_: ogpo.yaml

experiment:
  project: SFG
  seed: 1

env:
  limits_norm: true             # pretrained generators live in the [-1, 1] limits-normalised space
  demo_success_bonus: 5.0       # robomimic demos scored like the online env (first success +5)
  kitchen_online_demos: true    # kitchen demos relabelled with the online reward and termination

training:
  bc_pi_steps: 0                # start from a pretrained MeanFlow checkpoint (--checkpoint.restore_actor_path)
  q_warmup_steps: 10000         # W: collect W env steps with theta_0, then W critic-only updates
  online_steps: 1400000

buffer:
  utd_q: 1
  utd_pi: 1
  offline_ratio: 0.5            # RLPD: 128 demonstration + 128 online transitions per batch

eval:
  n_eval_envs: 8
  eval_episodes: 8              # 64 episodes per evaluation

intervals:
  eval_interval: 20000
  preemption_backup_interval: 20000

success_buffer:
  use_success_buffer: false

dataset:
  p_aug: 0.0

agent:
  # ---- critic (N = 10 layer-normalised heads, 4 or 5 x 512 per task)
  tau: 0.05
  actor_tau: 0.005
  best_of_n: 1

  # ---- pretrained one-step MeanFlow generator
  use_meanflow: true
  meanflow_latent_dist: normal
  time_embedding: scalar
  use_denoiser: false
  use_constant_noise: false
  use_tapered_noise: true
  error_correct_ode_to_sde: false
  eval_sde: false

  # ---- SFG
  sfg: true
  sfg_actor_lr: 3.0e-7
  sfg_critic_lr: 3.0e-4
  sfg_actor_clip: 1.0
  sfg_critic_clip: 1000.0
  sfg_actor_bs: 128
  sfg_nsub: 2
  sfg_func_delta: 0.01          # delta
  sfg_probe_states: 32
  sfg_probe_latents: 8
  sfg_freeze_obs_encoder: true

  # ---- not read by SFG: OGPO's PPO / shortcut / transformer settings, pinned to the values of the
  # paper runs so that flags.json is identical to theirs
  actor_scheduler: constant
  critic_end_value: 1.0e-8
  adv_strategy: conservative
  awr_beta: 10
  bc_coeff: 0.0
  use_bc_regularization: false
  constant_noise_std: 0.05
  min_noise_std: 0.01
  max_noise_std: 0.01
  q_vr_reduction: median
  chi_po_R_max: 100.0
  shortcut_inference_steps: 1
  shortcut_denoising_steps: 32
  bootstrap_ratio: 0.125
  tf_pi_layers: 4
  tf_pi_embed_dim: 512
  tf_q_layers: 4
  tf_q_embed_dim: 512

bc:
  clip_bc_wrt: SDE
